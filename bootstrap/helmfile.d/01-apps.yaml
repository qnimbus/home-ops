---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# ## App Bootstrap Phase
#
# Runs AFTER 00-crds.yaml (helmfile.d files are applied in alphabetical order).
# Installs the minimal set of controllers required before Flux can take over GitOps
# reconciliation.  Everything else is managed by Flux via the kubernetes/apps/ tree.
#
# Bootstrap order (each `needs:` entry enforces sequencing):
#   cilium → coredns → spegel → cert-manager → flux-operator → flux-instance
#
# Day-2 upgrades for all charts here are handled by Flux (via Renovate PRs updating
# the corresponding OCIRepository/HelmRelease), NOT by re-running this file.  Only
# re-run this file when rebuilding a cluster from scratch.
#
# Values are resolved via templates/values.yaml.gotmpl, which reads each release's
# helm/values.yaml from kubernetes/apps/<namespace>/<name>/app/helm/values.yaml.
# Adding a new release here requires no path change — the template derives the path
# from .Release.Namespace and .Release.Name automatically.

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

repositories:
  - name: cilium
    url: https://helm.cilium.io

releases:
  - name: cilium
    namespace: kube-system
    atomic: true
    chart: cilium/cilium
    version: 1.19.4
    values: ['./templates/values.yaml.gotmpl']

  - name: coredns
    namespace: kube-system
    atomic: true
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.45.2
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/cilium']

  - name: spegel
    namespace: kube-system
    atomic: true
    chart: oci://ghcr.io/spegel-org/helm-charts/spegel
    version: 0.7.1
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/coredns']

  - name: cert-manager
    namespace: cert-manager
    atomic: true
    createNamespace: true
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.20.2
    values: ['./templates/values.yaml.gotmpl']
    needs: ['kube-system/spegel']

  - name: flux-operator
    namespace: flux-system
    atomic: true
    createNamespace: true
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.50.0
    values: ['./templates/values.yaml.gotmpl']
    needs: ['cert-manager/cert-manager']

  - name: flux-instance
    namespace: flux-system
    atomic: true
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.50.0
    values: ['./templates/values.yaml.gotmpl']
    needs: ['flux-system/flux-operator']
