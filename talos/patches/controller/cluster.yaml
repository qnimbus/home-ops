cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true   # replaced by Cilium's DNS proxy / external CoreDNS HelmRelease
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - "10.60.0.0/24"   # nodeSubnet in talenv.yaml — keep etcd traffic on LAN
  proxy:
    disabled: true   # replaced by Cilium kube-proxy replacement
  scheduler:
    config:
      apiVersion: kubescheduler.config.k8s.io/v1
      kind: KubeSchedulerConfiguration
      profiles:
        - schedulerName: default-scheduler
          plugins:
            score:
              disabled:
                - name: ImageLocality   # don't favour nodes that already cache an image; prefer even spread
          pluginConfig:
            - name: PodTopologySpread
              args:
                defaultConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway   # soft constraint; still schedules if skew can't be met
                defaultingType: List
    extraArgs:
      bind-address: 0.0.0.0
