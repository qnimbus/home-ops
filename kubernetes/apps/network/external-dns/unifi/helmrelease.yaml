---
# yaml-language-server: $schema=https://schemas.clustrs.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-unifi
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns
    namespace: flux-system
  interval: 1h
  values:
    domainFilters:
      - "${DOMAIN_APP}"
      - "${DOMAIN_CASA}"
      - "${DOMAIN_CLUSTER}"
      - "${DOMAIN_APPS}"
      - "${DOMAIN_PROXII}"
      - "home.arpa"
    fullnameOverride: *app
    logLevel: &logLevel info
    policy: sync
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/kashalls/external-dns-unifi-webhook
          # renovate: datasource=docker depName=ghcr.io/kashalls/external-dns-unifi-webhook
          tag: v0.8.2@sha256:7f0ddbbc83a36a2a9d762e25eef9cafcb3adf0493068a27d72ae71087eafe6f0
        env:
          - name: LOG_LEVEL
            value: *logLevel
          - name: UNIFI_HOST
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-unifi-secret
                key: UNIFI_HOST
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: *secret
                key: UNIFI_API_KEY
          - name: UNIFI_SKIP_TLS_VERIFY
            value: "true"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    resources:
      requests:
        cpu: 15m
        memory: 90Mi
      limits:
        memory: 90Mi
    serviceMonitor:
      enabled: false
    sources:
      - gateway-httproute
      - service
    triggerLoopOnEvent: true
    txtOwnerId: k8s-internal
    txtPrefix: "k8s."
