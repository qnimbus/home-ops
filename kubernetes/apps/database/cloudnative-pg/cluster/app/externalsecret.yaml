---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudnative-pg-secret
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .CNPG_SUPER_USER }}"
        password: "{{ .CNPG_SUPER_PASS }}"
        CNPG_S3_ACCESS_KEY: "{{ .CNPG_S3_ACCESS_KEY }}"
        CNPG_S3_SECRET_KEY: "{{ .CNPG_S3_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
      rewrite:
        - regexp:
            source: (.*)
            target: CNPG_$1
