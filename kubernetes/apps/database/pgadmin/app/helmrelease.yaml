---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      pgadmin:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          init-config:
            image:
              repository: ghcr.io/home-operations/k8s-sidecar
              # renovate: datasource=docker depName=ghcr.io/home-operations/k8s-sidecar
              tag: 2.7.3@sha256:391ccddbc6b29b1b07fea530950eba68e941304ea9252084e07cf12f1687a81d
            command: ["/bin/bash", "-c"]
            args:
              - |
                USER_FOLDER=$(echo "/var/lib/pgadmin/storage/$PGADMIN_DEFAULT_EMAIL" | sed 's/@/_/g')
                echo "Creating user folder $USER_FOLDER"
                mkdir -p "$USER_FOLDER"
                cp /tmp/secrets/.pgpass "$USER_FOLDER/.pgpass"
                chown 5050:5050 "$USER_FOLDER/.pgpass"
                chmod 600 "$USER_FOLDER/.pgpass"
                echo "Done."
            env:
              PGADMIN_DEFAULT_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: &secret pgadmin-secret
                    key: PGADMIN_DEFAULT_EMAIL
        containers:
          app:
            image:
              repository: dpage/pgadmin4
              # renovate: datasource=docker depName=dpage/pgadmin4
              tag: "9.15.0"
            env:
              PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "20"
              PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
              PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
              PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
              PGADMIN_DISABLE_POSTFIX: "True"
              PGADMIN_LISTEN_PORT: &port 5050
              PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
            envFrom:
              - secretRef:
                  name: *secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /misc/ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /misc/ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: pgadmin
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          pgadmin:
            init-config:
              - path: /var/lib/pgadmin
            app:
              - path: /var/lib/pgadmin
      secrets:
        type: secret
        name: *secret
        advancedMounts:
          pgadmin:
            init-config:
              - path: /tmp/secrets/.pgpass
                subPath: pgpass
            app:
              - path: /pgadmin4/servers.json
                subPath: servers.json
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
