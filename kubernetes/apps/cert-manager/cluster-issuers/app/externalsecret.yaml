---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cert-manager-cloudflare
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cert-manager-secret
    template:
      engineVersion: v2
      data:
        # cert-manager ClusterIssuer's apiTokenSecretRef expects exactly this key
        API_TOKEN: "{{ .CF_API_TOKEN }}"
  dataFrom:
    - extract:
        key: cloudflared
      rewrite:
        - regexp:
            source: (.*)
            target: CF_$1
