---
# yaml-language-server: $schema=https://schemas.clustrs.dev/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${CLUSTER_ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cert-manager-secret
              key: API_TOKEN
        selector:
          dnsZones:
            - ${DOMAIN_APP}
            - ${DOMAIN_CASA}
            - ${DOMAIN_CLUSTER}
            - ${DOMAIN_APPS}
