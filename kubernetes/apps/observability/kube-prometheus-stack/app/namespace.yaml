---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    # node-exporter requires privileged pods: hostNetwork, hostPID, hostPath volumes
    # (/proc, /sys, /), and hostPort 9100. Without this label the namespace inherits
    # the cluster baseline PSA policy, which blocks all node-exporter pods.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
