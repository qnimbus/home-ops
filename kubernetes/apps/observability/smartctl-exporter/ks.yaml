---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smartctl-exporter
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: smartctl-exporter
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/observability/smartctl-exporter/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
