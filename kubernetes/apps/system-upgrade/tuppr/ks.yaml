---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: tuppr
  wait: false
  prune: true
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/system-upgrade/tuppr/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tuppr
      namespace: system-upgrade
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-upgrade
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/disabled: "true"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: tuppr
  # TalosUpgrade and KubernetesUpgrade CRDs don't exist until tuppr's HelmRelease
  # installs the chart. dependsOn blocks this Kustomization's dry-run until the
  # operator is healthy and the CRD types are registered in the API server.
  dependsOn:
    - name: tuppr
      namespace: flux-system
  wait: true
  prune: true
  interval: 1h
  path: ./kubernetes/apps/system-upgrade/tuppr/upgrade
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
