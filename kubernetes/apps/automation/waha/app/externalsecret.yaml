---
# yaml-language-server: $schema=https://schemas.clustrs.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: waha
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: waha-secret
    template:
      engineVersion: v2
      data:
        WAHA_API_KEY: "{{ .WAHA_API_KEY_HASH }}"
        WAHA_API_KEY_PLAIN: "{{ .WAHA_API_KEY_PLAIN }}"
        WAHA_DASHBOARD_USERNAME: "{{ .WAHA_DASHBOARD_USERNAME }}"
        WAHA_DASHBOARD_PASSWORD: "{{ .WAHA_DASHBOARD_PASSWORD }}"
        # WHATSAPP_* prefix is what WAHA expects; fields in 1Password omit that prefix
        WHATSAPP_HOOK_HMAC_KEY: "{{ .WAHA_HOOK_HMAC_KEY }}"
        WHATSAPP_SWAGGER_USERNAME: "{{ .WAHA_DASHBOARD_USERNAME }}"
        WHATSAPP_SWAGGER_PASSWORD: "{{ .WAHA_DASHBOARD_PASSWORD }}"
  dataFrom:
    - extract:
        key: waha
      rewrite:
        # Rules apply in sequence, each operating on the PREVIOUS rule's output —
        # not the original 1Password field name. This blanket rule runs first and
        # already renames username/password to WAHA_username/WAHA_password, so the
        # two rules below must match those prefixed names, not the bare originals.
        - regexp:
            source: (.*)
            target: WAHA_$1
        - regexp:
            source: ^WAHA_username$
            target: WAHA_DASHBOARD_USERNAME
        - regexp:
            source: ^WAHA_password$
            target: WAHA_DASHBOARD_PASSWORD
