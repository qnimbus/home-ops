---
# yaml-language-server: $schema=https://schemas.clustrs.dev/notification.toolkit.fluxcd.io/provider_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
spec:
  type: alertmanager
  # In-cluster Alertmanager Service — no external hop, works even if the gateway is down.
  address: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
---
# yaml-language-server: $schema=https://schemas.clustrs.dev/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-errors
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
  exclusionList:
    - "waiting to be reconciled"
    - "no change"
    - "is suspended"
