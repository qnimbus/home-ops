---
apiVersion: v1
kind: Service
metadata:
  name: kube-api
  annotations:
    external-dns.alpha.kubernetes.io/hostname: kube-vip.cluster.vwn.io
    external-dns.alpha.kubernetes.io/target: "10.60.0.2"
spec:
  type: LoadBalancer
  # Cluster (not Local): Cilium's L2-announcement leader election is unaware of
  # service endpoints and can elect a node with no local kube-apiserver pod (e.g.
  # a worker), silently black-holing all traffic to the VIP. loadBalancer.mode: dsr
  # (cilium values) already preserves the real client IP under Cluster policy, so
  # this loses nothing. Documented Cilium incompatibility + fix:
  # https://docs.cilium.io/en/stable/network/l2-announcements/
  externalTrafficPolicy: Cluster
  selector:
    k8s-app: kube-apiserver
    tier: control-plane
  ports:
    - name: https
      port: 6443
      protocol: TCP
      targetPort: 6443
